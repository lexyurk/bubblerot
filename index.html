<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Bubble Brainrot Overlay</title>
  <style>
    /* Center everything */
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* Wrapper keeps the video and canvas aligned */
    .bubble-wrapper {
      position: relative;
      width: 320px;   /* Adjust to taste */
      height: 320px;  /* Keep square for circular mask */
    }

    /* Video is rounded to appear as a Telegram bubble */
    .bubble-wrapper video {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Canvas overlays the video */
    .bubble-wrapper canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="bubble-wrapper">
    <!-- Replace with your own video if desired -->
    <video id="bubbleVid" src="test-bubble.mp4" autoplay muted loop playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <script>
    const video = document.getElementById('bubbleVid');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');

    // === CONFIGURABLE SETTINGS ===
    const RING_COUNT = 4;           // How many concentric rings
    const BASE_RING_RADIUS = 60;    // Innermost ring radius in px
    const RING_SPACING = 40;        // Distance between consecutive rings in px
    const RING_WIDTH = 12;          // Stroke width of each ring
    const HOLE_ARC = Math.PI / 4;   // Gap size (in radians) for each ring
    const BALL_RADIUS = 6;          // Radius of the bouncing ball
    const BALL_SPEED = 120;         // Ball speed in px/s

    // --- New Physics constants ---
    const COEFFICIENT_OF_RESTITUTION = 0.85; // How much energy is kept after a bounce (0-1)
    const FRICTION_FACTOR = 0.4;          // How much of the ring's spin is transferred to the ball

    /**
     * Ring data structure
     * {
     *   radius: number,
     *   width: number,
     *   holeSize: number,  // radians
     *   angle: number,     // radians (current rotation)
     *   speed: number,     // radians / second
     *   color: string,     // CSS rgba value
     * }
     */
    const rings = [];

    const ball = {
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      radius: BALL_RADIUS,
    };

    // Resize handler ensures the canvas matches the element size and accounts for HiDPI displays
    function resizeCanvas() {
      const { width, height } = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // Scale drawing operations
    }

    window.addEventListener('resize', resizeCanvas);

    // Initialize rings with alternating rotation directions and random starting angles
    function initRings() {
      rings.length = 0;
      for (let i = 0; i < RING_COUNT; i++) {
        const radius = BASE_RING_RADIUS + i * RING_SPACING;
        rings.push({
          radius,
          width: RING_WIDTH,
          holeSize: HOLE_ARC,
          angle: Math.random() * Math.PI * 2,
          // Alternate direction: even rings clockwise, odd counter‑clockwise
          speed: (i % 2 === 0 ? 1 : -1) * (0.3 + i * 0.1),
          color: 'rgba(255, 255, 255, 0.7)',
        });
      }
    }

    // (Re)spawn the ball in the center with a random direction
    function resetBall() {
      const { width, height } = canvas.getBoundingClientRect();
      ball.x = width / 2;
      ball.y = height / 2;
      const angle = Math.random() * Math.PI * 2;
      ball.vx = Math.cos(angle) * BALL_SPEED;
      ball.vy = Math.sin(angle) * BALL_SPEED;
    }

    // Physics & animation update step
    function update(dt) {
      // Rotate rings
      for (const ring of rings) {
        ring.angle += ring.speed * dt;
      }

      // Move ball
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      const { width, height } = canvas.getBoundingClientRect();
      const cx = width / 2;
      const cy = height / 2;

      // Vector from center to ball
      let dx = ball.x - cx;
      let dy = ball.y - cy;
      let dist = Math.hypot(dx, dy);

      // Check collision with each ring
      for (const ring of rings) {
        const ringInnerRadius = ring.radius - ring.width / 2;
        const ringOuterRadius = ring.radius + ring.width / 2;
        
        // Check if ball is colliding with the ring
        const ballDistanceFromRing = Math.abs(dist - ring.radius);
        const isCollidingWithRing = ballDistanceFromRing <= (ring.width / 2 + ball.radius);
        
        if (isCollidingWithRing) {
          // Compute ball's angle relative to the ring's rotation
          let ballAngle = Math.atan2(dy, dx);
          let relativeAngle = ballAngle - ring.angle;
          
          // Normalize angle to [0, 2π]
          while (relativeAngle < 0) relativeAngle += Math.PI * 2;
          while (relativeAngle >= Math.PI * 2) relativeAngle -= Math.PI * 2;
          
          // Calculate angular size of ball at this distance
          const angularBallSize = Math.asin(Math.min(0.99, ball.radius / (dist + 0.001)));
          
          // Check if ball is in the hole (considering ball size)
          const holeStart = -ring.holeSize / 2 - angularBallSize;
          const holeEnd = ring.holeSize / 2 + angularBallSize;
          
          const isInHole = (relativeAngle >= holeStart && relativeAngle <= holeEnd) || 
                           (relativeAngle >= (Math.PI * 2 + holeStart) && relativeAngle <= (Math.PI * 2 + holeEnd));
          
          } else {
            // Ball passed through the hole, "destroying" the ring.
            // For this temporary version, we'll just make it invisible.
            // A more advanced version in generateOverlay might have a particle effect.
            ring.visible = false;
            break; // Only handle one collision per frame
          }

          if (!isInHole) {
            // Ball bounces off the ring
            
            // Determine if hitting inner or outer edge
            const hitInner = dist < ring.radius;
            
            // Calculate correct normal vector
            let nx, ny;
            if (hitInner) {
              // Ball hits inner edge - normal points inward (toward center)
              nx = -dx / dist;
              ny = -dy / dist;
            } else {
              // Ball hits outer edge - normal points outward (away from center)
              nx = dx / dist;
              ny = dy / dist;
            }
            
            // --- NEW PHYSICS MODEL ---

            // 1. Decompose velocity into normal and tangential components
            const v_dot_n = ball.vx * nx + ball.vy * ny;
            const v_normal_x = v_dot_n * nx;
            const v_normal_y = v_dot_n * ny;
            const v_tangent_x = ball.vx - v_normal_x;
            const v_tangent_y = ball.vy - v_normal_y;

            // 2. Apply restitution to the normal component (the "bounce")
            // This reverses the normal velocity and reduces it, simulating energy loss.
            const v_normal_x_new = -v_normal_x * COEFFICIENT_OF_RESTITUTION;
            const v_normal_y_new = -v_normal_y * COEFFICIENT_OF_RESTITUTION;

            // 3. Calculate ring's surface velocity and apply friction to tangential component
            const tangent_x = -ny;
            const tangent_y = nx;
            // ring.speed is in rad/s. ring.radius is in px. Result is px/s.
            const ring_surface_speed = ring.speed * ring.radius;
            const ring_surface_vx = tangent_x * ring_surface_speed;
            const ring_surface_vy = tangent_y * ring_surface_speed;

            // The final tangential velocity is a mix of the ball's original tangent
            // and the ring's surface velocity, based on the friction factor.
            // This makes the ring "push" the ball along its direction of spin.
            const v_tangent_x_new = v_tangent_x * (1 - FRICTION_FACTOR) + ring_surface_vx * FRICTION_FACTOR;
            const v_tangent_y_new = v_tangent_y * (1 - FRICTION_FACTOR) + ring_surface_vy * FRICTION_FACTOR;

            // 4. Recombine components for the new velocity
            ball.vx = v_normal_x_new + v_tangent_x_new;
            ball.vy = v_normal_y_new + v_tangent_y_new;
            
            // Push ball out of collision zone to prevent sticking
            const penetration = (ring.width / 2 + ball.radius) - ballDistanceFromRing;
            if (penetration > 0) {
              if (hitInner) {
                // Push ball toward center
                ball.x -= nx * penetration;
                ball.y -= ny * penetration;
              } else {
                // Push ball away from center
                ball.x += nx * penetration;
                ball.y += ny * penetration;
              }
            }
            
            // Update position for next collision check
            dx = ball.x - cx;
            dy = ball.y - cy;
            dist = Math.hypot(dx, dy);
            
            break; // Only handle one collision per frame
          }
        }
      }

      // --- Boundary Bounce ---
      // If the ball goes beyond the visible area, bounce it back.
      const outermost = rings[rings.length - 1];
      // Define a boundary slightly larger than the last ring.
      const boundaryRadius = outermost.radius + outermost.width / 2;

      if (dist + ball.radius > boundaryRadius) {
        // Ball has hit the outer wall.

        // Push ball back into bounds to prevent sticking.
        const penetration = (dist + ball.radius) - boundaryRadius;
        ball.x -= (dx / dist) * penetration;
        ball.y -= (dy / dist) * penetration;

        // The normal of the collision is just the vector from the center to the ball.
        const nx = dx / dist;
        const ny = dy / dist;

        // Decompose velocity into normal and tangential components.
        const v_dot_n = ball.vx * nx + ball.vy * ny;
        const v_normal_x = v_dot_n * nx;
        const v_normal_y = v_dot_n * ny;
        const v_tangent_x = ball.vx - v_normal_x;
        const v_tangent_y = ball.vy - v_normal_y;

        // Reverse the normal component to create the bounce.
        // We use the same restitution coefficient for a consistent feel.
        const v_normal_x_new = -v_normal_x * COEFFICIENT_OF_RESTITUTION;
        const v_normal_y_new = -v_normal_y * COEFFICIENT_OF_RESTITUTION;

        // Recombine to get the new velocity.
        ball.vx = v_normal_x_new + v_tangent_x;
        ball.vy = v_normal_y_new + v_tangent_y;
      }

      // --- Win Condition Check ---
      // Check if all rings have been destroyed.
      const allRingsDestroyed = rings.every(ring => !ring.visible);
      if (allRingsDestroyed) {
        // If all rings are gone, reset the simulation.
        initRings();
        resetBall();
      }
    }

    // Render rings and ball on the canvas
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const { width, height } = canvas.getBoundingClientRect();
      const cx = width / 2;
      const cy = height / 2;

      // Draw rings (stroke with missing gap)
      for (const ring of rings) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(ring.angle);
        ctx.strokeStyle = ring.color;
        ctx.lineWidth = ring.width;
        ctx.beginPath();
        // Draw the visible part of the ring (two arcs on either side of the hole)
        ctx.arc(0, 0, ring.radius, ring.holeSize / 2, 2 * Math.PI - ring.holeSize / 2);
        ctx.stroke();
        ctx.restore();
      }

      // Draw the ball
      ctx.fillStyle = '#ff4444'; // More vibrant red
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // Main animation loop
    let lastTs = performance.now();
    function loop(now) {
      const dt = (now - lastTs) / 1000; // Delta time in seconds
      lastTs = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // Kick things off once video metadata is ready (so we know intrinsic size)
    video.addEventListener('loadedmetadata', () => {
      resizeCanvas();
      initRings();
      resetBall();
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
